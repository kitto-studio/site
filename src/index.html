<!DOCTYPE html>
<html lang="<!--moku:lang-->">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#211B18" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preload" href="/fonts/nunito/nunito-latin-900.woff2" as="font" type="font/woff2" crossorigin>
    <!-- No-flash theme: a saved or previewed light/dark choice applies before the first paint.
         "system" (or nothing) leaves data-theme unset, so the CSS follows prefers-color-scheme. -->
    <script>try{var t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("kitto-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
    <!--moku:head-->
    <!--moku:assets-->
  </head>
  <body><!--moku:body--></body>
</html>
